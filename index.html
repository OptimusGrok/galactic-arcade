<style>
html,body{margin:0;height:100%;background:#07040c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh;outline:none}
#ui{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;z-index:5}
#ui button{width:30px;height:30px;border-radius:7px;border:1px solid #ff2bd666;background:#0a0612aa;color:#ff8ce8;font:600 13px system-ui;padding:0;opacity:.55}
#ui button:active{opacity:1}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #ff2bd688;background:radial-gradient(#ff2bd622,#0000 70%);display:none;pointer-events:none;z-index:4}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#ff2bd6aa;box-shadow:0 0 14px #ff2bd6}
#playUI{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);z-index:6;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease}
#playUI.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#bPlay{font:900 clamp(28px,6vw,46px)/1 'Courier New',monospace;letter-spacing:.12em;color:#fff;padding:18px 44px 16px;border-radius:14px;border:3px solid #ff3b3b;background:linear-gradient(#2a0610ee,#120208ee);
 text-shadow:0 0 8px #ff4060,0 0 22px #ff2050;box-shadow:0 0 18px #ff203f99,inset 0 0 18px #ff203f55;cursor:pointer;animation:pp 1.1s ease-in-out infinite}
#bTicket{padding-left:58px;background-repeat:no-repeat;background-position:12px 50%;background-size:38px auto;background-image:var(--tkimg)}
#xx{padding-left:64px;background-repeat:no-repeat;background-position:16px 50%;background-size:40px auto;background-image:var(--tkimg)}
#bTicket.need{border-color:#666;color:#aaa;text-shadow:none;box-shadow:none;filter:grayscale(.7)}
#playUI.shake{animation:shake .45s}
#demoUI{position:fixed;inset:0;z-index:21;display:none;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding-bottom:max(9vh,calc(env(safe-area-inset-bottom) + 30px));cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Courier New',monospace}
#demoUI.on{display:flex}
#dTag{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#7fe8ff;font:700 13px 'Courier New',monospace;letter-spacing:.3em;text-shadow:0 0 8px #00c8ff;background:#0008;padding:4px 10px;border-radius:6px}
#dInsert{font:900 clamp(28px,7vw,52px)/1 'Courier New',monospace;letter-spacing:.1em;color:#ffe14a;text-shadow:0 0 10px #ffb000,0 0 26px #ff7a00,0 2px 0 #000;animation:dblink 1s steps(1) infinite;padding:8px 14px;background:#0009;border-radius:10px}
#dInsert.ready{color:#7dff8a;text-shadow:0 0 10px #20ff60,0 0 26px #00c040,0 2px 0 #000}
#dInsert.shake{animation:shake .45s,dblink 1s steps(1) infinite}
@keyframes dblink{50%{opacity:.15}}
#dCredit{font:700 clamp(15px,3.4vw,20px) 'Courier New',monospace;color:#fff;letter-spacing:.14em;text-shadow:0 0 6px #000,0 0 2px #000;background:#0009;padding:4px 12px;border-radius:8px}

@keyframes shake{0%,100%{margin-left:0}20%{margin-left:-14px}40%{margin-left:12px}60%{margin-left:-8px}80%{margin-left:5px}}
#bTicket{font:900 clamp(16px,3.6vw,24px)/1 'Courier New',monospace;letter-spacing:.08em;color:#fff;padding-top:12px;padding-bottom:11px;padding-right:20px;border-radius:12px;border:3px solid #ffc020;background-color:#1a0e00e6;cursor:pointer;pointer-events:auto;border-color:#ffc020;text-shadow:0 0 8px #ffb000,0 0 22px #ff9000;box-shadow:0 0 18px #ffb00099,inset 0 0 18px #ffb00055;font-size:clamp(22px,5vw,36px)}
@keyframes pp{50%{filter:brightness(1.35)}}
#credit{font:700 15px 'Courier New',monospace;letter-spacing:.25em;color:#ffe08a;text-shadow:0 0 6px #ffb000}
#hint{font:600 11px system-ui;color:#fff8;letter-spacing:.06em}
#game{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;border:0;z-index:20;background:#000;opacity:0;transition:opacity .45s ease}
#game.on{opacity:1}
#bExit{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 54px);left:max(8px,env(safe-area-inset-left));z-index:24;width:38px;height:38px;border-radius:50%;border:1px solid #fff5;background:#000a;color:#fff;font:700 18px system-ui;display:none;cursor:pointer}
#over{position:fixed;inset:0;z-index:22;display:none;align-items:center;justify-content:center;font:900 clamp(34px,8vw,64px) 'Courier New',monospace;color:#ff3b3b;text-shadow:0 0 14px #ff2050;background:#0008;letter-spacing:.1em}
#tix{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:23;font:700 13px 'Courier New',monospace;color:#ffe08a;background:#0a0612cc;border:1px solid #ffb00066;border-radius:8px;padding:5px 9px;letter-spacing:.08em;text-shadow:0 0 6px #ffb000;cursor:pointer;display:flex;align-items:center;gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
#tix:hover{border-color:#ffd040;box-shadow:0 0 10px #ffb00066}
#tixIco{display:block;filter:drop-shadow(0 0 3px #ffb000aa)}
#tview{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 50%,#2a1a0099,#000000d8);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#tview.on{display:flex;animation:tvin .28s ease-out}
@keyframes tvin{from{opacity:0}to{opacity:1}}
#tvWrap{position:relative;animation:tvtilt 5s ease-in-out infinite;filter:drop-shadow(0 0 22px #ffb000cc) drop-shadow(0 0 6px #ffd860)}
@keyframes tvtilt{0%,100%{transform:perspective(900px) rotateY(-9deg) rotateZ(-2deg)}50%{transform:perspective(900px) rotateY(9deg) rotateZ(2deg)}}
#tvShine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,#ffffff70 48%,transparent 60%);background-size:300% 100%;animation:tvshine 3.2s linear infinite;mix-blend-mode:overlay;-webkit-mask:var(--tmask);mask:var(--tmask)}
@keyframes tvshine{from{background-position:120% 0}to{background-position:-120% 0}}
#tvCount{font:900 22px 'Courier New',monospace;color:#ffe08a;text-shadow:0 0 10px #ffb000;letter-spacing:.12em}
#tvHint{font:700 11px 'Courier New',monospace;color:#c8a860;opacity:.8;letter-spacing:.1em}
#tvX{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:41;width:40px;height:40px;border-radius:50%;border:1px solid #ffd04088;background:#120a02cc;color:#ffe08a;font:700 18px sans-serif;cursor:pointer}
#tix.ingame{top:calc(max(10px,env(safe-area-inset-top)) + 100px);opacity:.85}
.tpop{position:fixed;z-index:24;font:900 18px 'Courier New',monospace;color:#ffe08a;text-shadow:0 0 8px #ffb000,0 0 2px #000;pointer-events:none;animation:tpop 1.4s ease-out forwards}
@keyframes tpop{0%{transform:translateY(6px) scale(.7);opacity:0}15%{transform:translateY(0) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateY(-34px) scale(1);opacity:0}}
</style>
