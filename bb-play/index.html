<script>// Gold monkey ticket: vector drawing (crisp at any size), shared by the arcade HUD / enlarged view and the game copies.
window.TicketArt = (function () {
  const cache = {};
  function monkey(g, cx, cy, r) {
    const C = (x, y, rr) => { g.beginPath(); g.arc(x, y, rr, 0, Math.PI * 2); };
    const E = (x, y, rx, ry) => { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); };
    const fur = g.createRadialGradient(cx - r * 0.3, cy - r * 0.45, r * 0.1, cx, cy, r * 1.1); fur.addColorStop(0, '#a8662e'); fur.addColorStop(0.6, '#7a4219'); fur.addColorStop(1, '#4a250c');

    for (const s of [-1, 1]) { C(cx + s * r * 0.98, cy - r * 0.02, r * 0.34); g.fillStyle = fur; g.fill(); g.lineWidth = r * 0.05; g.strokeStyle = '#3a1c08'; g.stroke();
      C(cx + s * r * 0.98, cy - r * 0.02, r * 0.2); g.fillStyle = '#e9a98a'; g.fill(); C(cx + s * r * 1.01, cy + r * 0.02, r * 0.1); g.fillStyle = '#c97e62'; g.fill(); }
    // tuft on top
    g.fillStyle = '#5a2e10'; g.beginPath(); g.moveTo(cx - r * 0.32, cy - r * 0.86); g.quadraticCurveTo(cx - r * 0.22, cy - r * 1.32, cx - r * 0.04, cy - r * 1.18);
    g.quadraticCurveTo(cx + r * 0.06, cy - r * 1.42, cx + r * 0.2, cy - r * 1.2); g.quadraticCurveTo(cx + r * 0.36, cy - r * 1.3, cx + r * 0.34, cy - r * 0.86); g.closePath(); g.fill();
    // head + fur shading
    C(cx, cy, r); g.fillStyle = fur; g.fill(); g.lineWidth = r * 0.05; g.strokeStyle = '#3a1c08'; g.stroke();
    g.save(); C(cx, cy, r); g.clip(); g.strokeStyle = 'rgba(40,18,4,0.35)'; g.lineWidth = r * 0.035;
    for (let i = 0; i < 9; i++) { const a = -2.6 + i * 0.32, x = cx + Math.cos(a) * r * 0.86, y = cy + Math.sin(a) * r * 0.86; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r * 0.16, y + Math.sin(a) * r * 0.16); g.stroke(); }

    const sk = g.createLinearGradient(0, cy - r * 0.6, 0, cy + r * 0.9); sk.addColorStop(0, '#fbdcb0'); sk.addColorStop(1, '#d9a068');
    g.fillStyle = sk; g.beginPath(); g.arc(cx - r * 0.3, cy - r * 0.16, r * 0.36, 0, Math.PI * 2); g.arc(cx + r * 0.3, cy - r * 0.16, r * 0.36, 0, Math.PI * 2); g.fill();
    E(cx, cy + r * 0.34, r * 0.62, r * 0.5); g.fill();

    g.strokeStyle = '#3a1c08'; g.lineCap = 'round'; g.lineWidth = r * 0.075;

      C(cx + s * r * 0.26, cy - r * 0.13, r * 0.105); g.fillStyle = '#2a1405'; g.fill(); C(cx + s * r * 0.22, cy - r * 0.18, r * 0.04); g.fillStyle = '#fff'; g.fill(); }
    // nostrils + smile
    g.fillStyle = '#5a2c10'; E(cx - r * 0.09, cy + r * 0.2, r * 0.05, r * 0.035); g.fill(); E(cx + r * 0.09, cy + r * 0.2, r * 0.05, r * 0.035); g.fill();
    g.strokeStyle = '#4a200a'; g.lineWidth = r * 0.07; g.beginPath(); g.arc(cx, cy + r * 0.28, r * 0.32, 0.35, Math.PI - 0.35); g.stroke();
    g.fillStyle = 'rgba(230,110,90,0.35)'; E(cx - r * 0.42, cy + r * 0.3, r * 0.1, r * 0.06); g.fill(); E(cx + r * 0.42, cy + r * 0.3, r * 0.1, r * 0.06); g.fill();
  }
  // ticket of width w, height h at 0,0. big: inner border + GALACTIC ARCADE / ADMIT ONE text
  function paint(g, w, h, big) {
    const n = h * 0.16, lw = Math.max(1, w / 60);

    const gr = g.createLinearGradient(0, 0, w * 0.3, h); gr.addColorStop(0, '#fff6b8'); gr.addColorStop(0.35, '#ffd23a'); gr.addColorStop(0.7, '#f0a800'); gr.addColorStop(1, '#b87400');
    path(); g.fillStyle = gr; g.fill();
    g.save(); path(); g.clip();   // subtle diagonal shine
    const sh = g.createLinearGradient(w * 0.15, 0, w * 0.45, h); sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(0.5, 'rgba(255,255,255,0.45)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sh; g.fillRect(0, 0, w, h); g.restore();
    path(); g.lineWidth = lw; g.strokeStyle = '#7a4a00'; g.stroke();

      g.setLineDash([w / 60, w / 90]); g.strokeStyle = 'rgba(122,74,0,0.7)'; g.lineWidth = lw * 0.6; g.strokeRect(w * 0.08, h * 0.08, w * 0.84, h * 0.84); g.setLineDash([]);
      g.fillStyle = '#6a3c00'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '900 ' + Math.round(h * 0.11) + 'px "Courier New", monospace';
      g.fillText('GALACTIC ARCADE', w / 2, h * 0.17, w * 0.78); g.fillText('ADMIT ONE', w / 2, h * 0.84);
      g.font = '900 ' + Math.round(h * 0.09) + 'px "Courier New", monospace'; g.fillText('★', w * 0.17, h / 2); g.fillText('★', w * 0.83, h / 2);
      monkey(g, w / 2, h * 0.52, h * 0.22);
    } else monkey(g, w / 2, h * 0.54, h * 0.3);
  }
  // cached hi-res sprite for a ticket w game-pixels wide
  function sprite(w) {
    if (cache[w]) return cache[w];
    const s = Math.max(8, Math.ceil(64 / w) * 2), h = Math.round(w * 0.66), c = document.createElement('canvas'); c.width = w * s; c.height = h * s;
    const g = c.getContext('2d'); g.scale(s, s); paint(g, w, h, false);
    return (cache[w] = { c, w, h });
  }
  function draw(ctx, x, y, w, t, alpha) {
    const sp = sprite(w), k = 0.5 + 0.5 * Math.sin(t * 6);
    ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
    const gl = ctx.createRadialGradient(x, y, 0, x, y, w * (0.9 + 0.35 * k)); gl.addColorStop(0, 'rgba(255,215,64,' + (0.55 + 0.3 * k) + ')'); gl.addColorStop(1, 'rgba(255,190,0,0)');
    ctx.fillStyle = gl; ctx.fillRect(x - w * 1.3, y - w * 1.3, w * 2.6, w * 2.6);

  // paint onto a DOM canvas of CSS size cw x ch (ticket fills it), at device resolution
  function toCanvas(cv, cw, big) { const d = Math.min(3, window.devicePixelRatio || 1), ch = Math.round(cw * (big ? 0.62 : 0.66));
    cv.width = Math.round(cw * d); cv.height = Math.round(ch * d); cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    const g = cv.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, cw, ch); paint(g, cw, ch, big); return cv; }
  // Every machine costs 5 tickets (was strike 1, ghost 1, monkey 1, orc 3, nova 2): one pickup pays 5 / old price tickets so each game's
  // tickets-per-ticket-spent stays what it was. Fractions carry over between pickups (orc 5/3, nova 2.5).
  const PAYX = { strike: 5, ghost: 5, monkey: 5, orc: 5 / 3, nova: 2.5 }, ACC = {};
  function collect(game) { if (window.__DEMO) return; const x = PAYX[game] || 1; ACC[game] = (ACC[game] || 0) + x; const n = Math.floor(ACC[game] + 1e-9); ACC[game] -= n;
    window.__ticketsGot = (window.__ticketsGot || 0) + n; if (!n) return; try { parent !== window && parent.__neonTicket && parent.__neonTicket(n, game); } catch (e) {} }
  collect.PAYX = PAYX;
  return { sprite, draw, paint, toCanvas, monkey, collect };
})();

<script>
/* BURROW BUSTER — an original dig-and-pump arcade game. Single file, no assets. */
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const T=32,HUDH=40;let COLS=14,ROWS=17,FW=COLS*T,FH=HUDH+ROWS*T;
let VW=FW,VH=FH,FX=0,FY=0,K=1,S=1,HX=0,HY=0,HW=FW,HH=HUDH,HUDSIDE=false;
let seed=Date.now()>>>0; function rand(){seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
const rnd=(a,b)=>a+rand()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
const DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},REV={u:'d',d:'u',l:'r',r:'l'};
const HI_KEY='arcade_bb_hi';let hiScore=+(localStorage.getItem(HI_KEY)||0);

/* ---------- AUDIO ---------- */
const Audio={ac:null,master:null,noiseBuf:null,muted:localStorage.getItem('arcade_bb_mute')==='1',
 init(){ if(!this.ac){try{const AC=window.AudioContext||window.webkitAudioContext;this.ac=new AC();this.master=this.ac.createGain();this.master.gain.value=this.muted?0:0.5;this.master.connect(this.ac.destination);
   const n=this.ac.sampleRate*0.5,b=this.ac.createBuffer(1,n,this.ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.noiseBuf=b;}catch(e){return;}}
   if(this.ac.state!=='running'){const p=this.ac.resume();if(p&&p.catch)p.catch(()=>{});} },
 toggle(){this.muted=!this.muted;localStorage.setItem('arcade_bb_mute',this.muted?'1':'0');if(this.master)this.master.gain.value=this.muted?0:0.5;updMute();},
 ok(){return this.ac&&!this.muted&&this.ac.state==='running';},
 tone(type,f0,f1,dur,vol,delay){if(!this.ok())return;const t=this.ac.currentTime+(delay||0),o=this.ac.createOscillator(),g=this.ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.02);},
 noise(dur,vol,fc,delay){if(!this.ok())return;const t=this.ac.currentTime+(delay||0),s=this.ac.createBufferSource(),f=this.ac.createBiquadFilter(),g=this.ac.createGain();s.buffer=this.noiseBuf;f.type='lowpass';f.frequency.value=fc||2000;g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+dur+0.02);}
};
const N=s=>440*Math.pow(2,s/12);
const Sfx={shoot(){Audio.tone('square',300,900,0.08,0.08);},pump(i){Audio.tone('square',200+i*120,320+i*160,0.09,0.12);},
 pop(){Audio.noise(0.25,0.3,3000);Audio.tone('square',900,120,0.2,0.12);},charge(){Audio.tone('sawtooth',90,180,0.6,0.06);},
 fire(){Audio.noise(0.6,0.22,900);},rock(){Audio.noise(0.5,0.35,400);Audio.tone('triangle',120,50,0.4,0.2);},
 crush(){Audio.noise(0.3,0.4,1500);},die(){for(let i=0;i<6;i++)Audio.tone('square',N(12-i*3),N(10-i*3),0.14,0.1,i*0.13);},
 veg(){[0,4,7,12].forEach((s,i)=>Audio.tone('square',N(s+12),N(s+12),0.08,0.1,i*0.07));},extra(){[0,7,12,7,12,19].forEach((s,i)=>Audio.tone('square',N(s+5),N(s+5),0.09,0.1,i*0.08));},

 start(){[0,0,7,7,9,9,7,-99,5,5,4,4,2,2,0].forEach((s,i)=>s>-99&&Audio.tone('square',N(s),N(s),0.1,0.08,i*0.1));}};

// robust mobile audio unlock

addEventListener('keyup',e=>{const d=KEYD[e.code];if(d)In.keys=In.keys.filter(k=>k!==d);if(e.code==='Space'||e.code==='KeyZ')In.pump=false;});
addEventListener('blur',()=>{In.keys=[];In.pump=false;In.tdir=null;});/* arcade copy: the arcade's HOLD pauses instead */
function wantDir(){return In.tdir||(In.keys.length?In.keys[In.keys.length-1]:null);}
const touchEl=document.getElementById('touch'),pumpEl=document.getElementById('pump');

/* Swipe/drag anywhere to steer: direction = dominant axis once past threshold; origin re-anchors so mid-drag turns work. */
const Swipe={id:null,ox:0,oy:0,TH:14};

 let horiz=ax>ay;if(cur==='l'||cur==='r'){if(ay<ax*H)horiz=true;}else if(cur==='u'||cur==='d'){if(ax<ay*H)horiz=false;}

/* ---------- LAYOUT: adaptive full-window view, field never covered by controls ---------- */
function place(el,x,y,w,h){el.style.left=x+'px';el.style.top=y+'px';if(w!=null){el.style.width=w+'px';el.style.height=h+'px';}}
function resize(){
 const vw=innerWidth,vh=innerHeight,touch=document.body.classList.contains('touch'),port=vh>vw*1.05;
 if(typeof G!=='undefined'&&G.mode==='title'&&!G.fixedGrid){const[c,r]=wantGrid();if(c!==COLS||r!==ROWS){setGrid(c,r);paintDirt();}}
 const GH=ROWS*T,MG=8;let s;HUDSIDE=false;
 if(!port){s=Math.min(vh/GH,vw/(FW+272));if((vw/s-FW)/2>=130)HUDSIDE=true;else s=Math.min(vh/FH,vw/FW);}
 else s=Math.min(vw/FW,vh/FH);
 s=Math.max(s,0.25);S=s;VW=vw/s;VH=vh/s;
 if(HUDSIDE){FX=(VW-FW)/2;FY=(VH-GH)/2;HX=FX-132;HY=FY;HW=124;HH=170;}
 else{FX=(VW-FW)/2;FY=port?HUDH:(VH-FH)/2+HUDH;HX=FX;HY=FY-HUDH;HW=FW;HH=HUDH;}
 if(window.__gaTop){const o=window.__gaTop/s;if(HUDSIDE)HY=Math.max(HY,o);else if(HX*s<130){FY+=o;HY+=o;}}   // t757u: HUD below the arcade close X
 const dpr=Math.min(devicePixelRatio||1,2),bw=Math.min(Math.round(vw*dpr),2400);K=bw/VW;
 cv.width=bw;cv.height=Math.round(VH*K);cv.style.width=vw+'px';cv.style.height=vh+'px';
 const fx=FX*s,fw=FW*s,mini=document.getElementById('mini'),P=64,rm=vw-fx-fw;
 if(!port&&HUDSIDE){place(pumpEl,fx+fw+rm/2-P/2,vh-MG-P-8,P,P);place(mini,Math.min(vw-146,fx+fw+rm/2-73),vh-MG-P-8-54);}
 else{place(pumpEl,vw-MG-P-6,vh-MG-P-6,P,P);place(mini,vw/2-73,vh-MG-44);}
 if(!touch)place(mini,HUDSIDE?Math.min(vw-146,fx+fw+rm/2-73):vw-150,HUDSIDE?vh-52:Math.max(4,HY*s-50));
}
window.__gaHudPx=()=>HUDSIDE?0:Math.round((HY+HH)*S);   // t818u: bottom of the HUD in CSS px, so the arcade puts its close X / options right under it on an upright phone
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));if(window.visualViewport)visualViewport.addEventListener('resize',resize);

const PAL={B:'#2a6cff',b:'#123a9c',W:'#f4f4f4',S:'#ffc090',K:'#111',H:'#9aa',R:'#e83828',r:'#a01810',Y:'#ffe040',G:'#38c048',D:'#1c7a2c',L:'#b8f070',O:'#ff9020',P:'#ff70c0'};
function spr(rows){const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');rows.forEach((row,j)=>{for(let i=0;i<16;i++){const ch=row[i];if(ch&&ch!=='.'){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1);}}});return c;}
const DIG_TOP=["................","....bBBBBb......","...bBBBBBBBb....","...BBWWWWWBB....","...BWSSSKSWB....","...BWSSSSSSB....","....WWSSSSW.....","....WWWWWWWW....","...WWBWWWWWWHHH.","...WWBWWWWWWHH..","...WWBWWWWWW....","....WWWWWWW....."];
const SPR={
 dig1:spr(DIG_TOP.concat(["....WW..WW......","....WW..WW......","...bBB..bBB.....","................"])),
 dig2:spr(DIG_TOP.concat(["....WWWWW.......",".....WWW.WW.....","....bBB...bBB...","................"])),
 pk1:spr(["................",".....RRRRRR.....","...RRRRRRRRRR...","..RRRRRRRRRRRR..","..RYYYYRRYYYYR..",".RYWWKYRYWWKYRR.",".RYWWKYRYWWKYRR.",".RRYYYYRRYYYYRR.",".RRRRRRRRRRRRRR.",".RRRRRRRRRRRRRr.","..RRRRRRRRRRRr..","..rRRRRRRRRRrr..","...rrRRRRRRrr...","....WW....WW....","...WWW....WWW...","................"]),
 pk2:spr(["................",".....RRRRRR.....","...RRRRRRRRRR...","..RRRRRRRRRRRR..","..RYYYYRRYYYYR..",".RYWKWYRYWKWYRR.",".RYWKWYRYWKWYRR.",".RRYYYYRRYYYYRR.",".RRRRRRRRRRRRRR.",".RRRRRRRRRRRRRr.","..RRRRRRRRRRRr..","..rRRRRRRRRRrr..","...rrRRRRRRrr...",".....WW..WW.....","....WWW..WWW....","................"]),
 fy1:spr(["................",".........GGGG...","........GGGGGG..","...L....GGWKGG..","..LLL..GGGWKGGG.",".LLLLGGGGGGGGGGG",".LLGGGGGGGGGGRR.","..GGGYYYYGGGG...",".GGGYYYYYYGG....",".GGGYYYYYYGD....","GGD.GYYYYGD.....","GD..GGGGGGD.....","D....GG..GG.....",".....GG..GG.....","....YYY..YYY....","................"]),
 fy2:spr(["................",".........GGGG...","........GGGGGG..","........GGWKGG..","..L....GGGWKGGG.",".LLLLGGGGGGGGGGG","LLLGGGGGGGGGGRR.","..GGGYYYYGGGG...",".GGGYYYYYYGG....",".GGGYYYYYYGD....",".GGDGYYYYGD.....","..GDGGGGGGD.....","...D.GGGGG......","....GG...GG.....","...YYY...YYY....","................"]),
};
// dirt layer (tunnels are carved out of it)
const dirtCv=document.createElement('canvas');dirtCv.width=FW;dirtCv.height=ROWS*T;const dctx=dirtCv.getContext('2d');
const STRATA=[['#f0b838','#c88a20','#ffd870'],['#d88020','#a85a10','#f0a050'],['#b84c20','#7e2c10','#d8703a'],['#7c2c14','#4c1608','#a04a2a']];
function layerOf(r){return Math.max(0,Math.min(3,Math.floor((r-2)*4/(ROWS-2))));}
function setGrid(c,r){if(c===COLS&&r===ROWS)return;COLS=c;ROWS=r;FW=c*T;FH=HUDH+r*T;dirtCv.width=FW;dirtCv.height=r*T;}
function wantGrid(){const vw=innerWidth,vh=innerHeight;if(vh>vw*1.05){const s=vw/(14*T),top=(window.__gaTop||0)/s;return[14,Math.max(17,Math.min(30,Math.floor((vh/s-HUDH-top)/T)))];}   // t818u: leave room for the arcade strip above the HUD so the last row is not cut off
 const s=vh/(17*T);return[Math.max(14,Math.min(24,Math.floor((vw/s-272)/T))),17];}
function paintDirt(){dctx.clearRect(0,0,FW,ROWS*T);let s=1234;const pr=()=>((s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff);
 for(let r=2;r<ROWS;r++){const c=STRATA[layerOf(r)];dctx.fillStyle=c[0];dctx.fillRect(0,r*T,FW,T);
  for(let i=0;i<70;i++){dctx.fillStyle=pr()<0.6?c[1]:c[2];const x=Math.floor(pr()*FW/2)*2,y=r*T+Math.floor(pr()*T/2)*2;dctx.fillRect(x,y,2,2);}}
 for(let b=3;b<ROWS;b++)if(layerOf(b)!==layerOf(b-1)){dctx.fillStyle=STRATA[layerOf(b)][1];for(let x=0;x<FW;x+=4)dctx.fillRect(x,b*T+((x>>2)%3===0?-2:0),4,2);}}

/* ---------- GAME STATE ---------- */
const G={mode:'title',modeT:0,score:0,lives:3,round:1,nextExtra:10000,frame:0,enemies:[],rocks:[],fx:[],veg:null,harp:null,god:false,player:null,dug:[],hE:[],vE:[],rocksFallen:0,vegDone:false,espd:1};
const grid=()=>Array.from({length:ROWS},()=>new Array(COLS).fill(false));
function carveRect(x,y,w,h){dctx.clearRect(x,y,w,h);}
function digTile(c,r){if(r<0||r>=ROWS||c<0||c>=COLS)return;G.dug[r][c]=true;carveRect(c*T+2,r*T+2,T-4,T-4);}
function openEdge(c,r,d){const[dx,dy]=DIRS[d],c2=c+dx,r2=r+dy;if(c2<0||c2>=COLS||r2<1||r2>=ROWS)return;digTile(c,r);digTile(c2,r2);
 if(dx){const cc=Math.min(c,c2);G.hE[r][cc]=true;carveRect(cc*T+T-4,r*T+2,8,T-4);}else{const rr=Math.min(r,r2);G.vE[rr][c]=true;carveRect(c*T+2,rr*T+T-4,T-4,8);}}
function edgeOpen(c,r,d){const[dx,dy]=DIRS[d],c2=c+dx,r2=r+dy;if(c2<0||c2>=COLS||r2<1||r2>=ROWS)return false;return dx?G.hE[r][Math.min(c,c2)]:G.vE[Math.min(r,r2)][c];}
function rockAt(c,r){return G.rocks.some(k=>(k.st==='still'||k.st==='wobble')&&k.c===c&&Math.round(k.y/T)===r);}
function canGo(c,r,d){const[dx,dy]=DIRS[d];return edgeOpen(c,r,d)&&!rockAt(c+dx,r+dy);}
function aligned(o){return o.x%T===0&&o.y%T===0;}
function stepToward(o,d,spd){const[dx,dy]=DIRS[d];if(dx){const g=dx>0?Math.floor(o.x/T+1e-9)*T+T:Math.ceil(o.x/T-1e-9)*T-T;o.x=dx>0?Math.min(o.x+spd,g):Math.max(o.x-spd,g);}
 else{const g=dy>0?Math.floor(o.y/T+1e-9)*T+T:Math.ceil(o.y/T-1e-9)*T-T;o.y=dy>0?Math.min(o.y+spd,g):Math.max(o.y-spd,g);}}
function baseLevel(){G.dug=grid();G.hE=grid();G.vE=grid();paintDirt();G.rocks=[];G.enemies=[];G.fx=[];G.veg=null;G.harp=null;G.rocksFallen=0;G.vegDone=false;
 for(let c=0;c<COLS;c++){G.dug[1][c]=true;G.dug[0][c]=true;if(c<COLS-1)G.hE[1][c]=true;}
 G.espd=Math.min(0.85+0.07*(G.round-1),1.7);}
function mkEnemy(type,c,r,dir){return{type,x:c*T,y:r*T,sx:c*T,sy:r*T,dir:dir||'r',face:'r',st:'walk',inf:0,defT:0,ghostCD:ghostCD(),gT:0,fireCD:ri(200,400),fT:0,flame:0,flee:false,t:0,gone:false};}
function ghostCD(){return ri(420,840)/(1+0.12*(G.round-1));}
function mkRock(c,r){return{c,x:c*T,y:r*T,st:'still',t:0,crushed:[],gone:false};}
function newLevel(){if(!G.fixedGrid)setGrid(...wantGrid());baseLevel();const PC=Math.floor(COLS/2)-1,PR=Math.floor(ROWS/2);G.pc=PC;G.pr=PR;
 for(let r=2;r<=PR;r++)openEdge(PC,r-1,'d');
 G.player={x:PC*T,y:PR*T,sx:PC*T,sy:PR*T,dir:'r',moving:false,digging:false,anim:0};
 const AR=COLS*ROWS/238,n=Math.min(3+G.round,9)+Math.max(0,Math.round((AR-1)*2.5)),nf=Math.min(1+Math.floor(G.round/2),n-1);
 const used=(c,r)=>c<0||c>=COLS||r<3||r>=ROWS||G.dug[r][c]||G.dug[r-1][c]||(r+1<ROWS&&G.dug[r+1][c]);
 for(let i=0;i<n;i++){for(let tries=0;tries<200;tries++){const hz=rand()<0.6,len=ri(3,4),c=ri(0,hz?COLS-len:COLS-1),r=ri(3,hz?ROWS-1:ROWS-len);
   const cells=[];for(let k=0;k<len;k++)cells.push(hz?[c+k,r]:[c,r+k]);
   if(cells.some(([a,b])=>used(a,b)||(Math.abs(a-PC)+Math.abs(b-PR))<5))continue;
   for(let k=0;k<len-1;k++)openEdge(cells[k][0],cells[k][1],hz?'r':'d');const m=cells[1];G.enemies.push(mkEnemy(i<nf?'f':'p',m[0],m[1],hz?'r':'d'));break;}}
 const nr=Math.round((3+Math.min(2,Math.floor((G.round-1)/3)))*Math.sqrt(AR));
 for(let i=0;i<nr;i++)for(let tries=0;tries<200;tries++){const c=ri(0,COLS-1),r=ri(3,ROWS-3);
   if(G.dug[r][c]||G.dug[r+1][c]||G.dug[r-1][c]||G.rocks.some(k=>Math.abs(k.c-c)<2&&Math.abs(k.y/T-r)<2))continue;G.rocks.push(mkRock(c,r));break;}
}
function startGame(o){o=o||{};G.score=0;G.lives=o.lives||3;G.round=o.round||1;G.nextExtra=10000;G.god=!!o.god;if(o.seed!=null)seed=o.seed>>>0;
 newLevel();G.mode='ready';G.modeT=0;In.pumpP=false;Sfx.start();}
function addScore(n,x,y){G.score+=n;if(x!=null)G.fx.push({x,y,txt:String(n),t:0});
 if(G.score>=G.nextExtra){G.lives++;G.nextExtra+=G.nextExtra===10000?30000:40000;Sfx.extra();G.fx.push({x:G.player.x,y:G.player.y-16,txt:'1UP!',t:0});}
 if(G.score>hiScore){hiScore=G.score;localStorage.setItem(HI_KEY,hiScore);}}
function killPlayer(cause){if(G.god||G.mode!=='play')return;G.mode='dying';G.modeT=0;G.harp=null;G.deathCause=cause;Sfx.die();}
function afterDeath(){G.lives--;if(G.lives<=0){G.mode='over';G.modeT=0;if(G.score>hiScore){hiScore=G.score;}if(!window.__DEMO)localStorage.setItem(HI_KEY,hiScore);return;}
 const p=G.player;p.x=p.sx;p.y=p.sy;p.dir='r';
 for(const e of G.enemies)if(e.st!=='pop'&&e.st!=='crushed'){e.x=e.sx;e.y=e.sy;e.st='walk';e.inDirt=false;e.inf=0;e.flame=0;e.flee=false;e.ghostCD=ghostCD();e.fireCD=ri(200,400);}
 G.mode='ready';G.modeT=0;}

/* ---------- PLAYER + PUMP ---------- */
function updPlayer(pp){const p=G.player;p.moving=false;const w=wantDir();
 if(G.harp){updHarp(pp,w);return;}
 if(pp){G.harp={len:0,dir:p.dir,st:'out',tgt:null,t:0};Sfx.shoot();return;}
 if(p.bufT>0)p.bufT--;let w2=w;if(!w2&&p.bufT>0){if(aligned(p)){w2=p.buf;p.bufT=0;}else w2=p.dir;}
 if(!w2)return;let d=w2;const wH=d==='l'||d==='r';
 if(p.x%T!==0&&!wH){d=p.dir;p.buf=w2;p.bufT=24;}else if(p.y%T!==0&&wH){d=p.dir;p.buf=w2;p.bufT=24;}
 const[dx,dy]=DIRS[d];
 if(aligned(p)){const c=p.x/T+dx,r=p.y/T+dy;p.dir=d;if(c<0||c>=COLS||r<1||r>=ROWS||rockAt(c,r))return;}
 p.dir=d;stepToward(p,d,p.digging?1.35:1.75);p.moving=true;p.anim++;
 const c0=Math.floor(p.x/T),c1=Math.ceil(p.x/T),r0=Math.floor(p.y/T),r1=Math.ceil(p.y/T);let nw=false;
 for(const[c,r]of[[c0,r0],[c1,r1]])if(!G.dug[r][c]){G.dug[r][c]=true;nw=true;}
 if(c0!==c1)G.hE[r0][c0]=true;if(r0!==r1)G.vE[r0][c0]=true;
 if(p.y>=T)carveRect(p.x+2,p.y+2,T-4,T-4);
 p.digging=nw||(p.digging&&!aligned(p));}
function harpTip(h){const p=G.player,[dx,dy]=DIRS[h.dir];return[p.x+T/2+dx*(T/2+h.len),p.y+T/2+dy*(T/2+h.len)];}
function updHarp(pp,w){const h=G.harp;h.t++;
 if(h.st==='out'){h.len+=7;const[tx,ty]=harpTip(h);
  for(const e of G.enemies){if(!(['walk','emerge','inflate','charge','fire'].includes(e.st)||(e.st==='ghost'&&!e.inDirt)))continue;
   if(Math.abs(e.x+T/2-tx)<T/2&&Math.abs(e.y+T/2-ty)<T/2){h.st='hold';h.tgt=e;h.t=0;e.inf=e.st==='inflate'?e.inf+1:1;e.st='inflate';e.flame=0;e.defT=0;Sfx.pump(e.inf);if(e.inf>=4){popEnemy(e,h.dir);G.harp=null;}return;}}
  const c=Math.floor(tx/T),r=Math.floor(ty/T);if(tx<0||tx>=FW||ty<T||ty>=ROWS*T||!G.dug[r][c]||h.len>=T*2.6)h.st='in';}
 else if(h.st==='in'){h.len-=14;if(h.len<=0)G.harp=null;}
 else{const e=h.tgt;if(e.st!=='inflate'){G.harp=null;return;}
  if(w&&!pp){G.harp=null;return;}
  if(pp||(In.pump&&h.t%16===0)){e.inf++;e.defT=0;Sfx.pump(e.inf);if(e.inf>=4){popEnemy(e,h.dir);G.harp=null;}}}}
function popEnemy(e,hdir){const lay=layerOf(Math.round(e.y/T));let pts=[200,300,400,500][lay];if(e.type==='f'&&(hdir==='l'||hdir==='r'))pts*=2;
 e.st='pop';e.t=0;addScore(pts,e.x,e.y);Sfx.pop();}

/* ---------- ENEMIES ---------- */
function updEnemy(e){const p=G.player,spd=G.espd*(e.flee?1.3:1)*(e.type==='f'?0.92:1);e.t++;
 switch(e.st){
 case 'walk':{
  if(e.flee){fleeMove(e,spd);break;}
  e.ghostCD--;if(e.type==='f')e.fireCD--;
  if(aligned(e)){
   if(e.type==='f'&&e.fireCD<=0){if(Math.abs(p.y-e.y)<T||rand()<0.3){e.st='charge';e.fT=0;if(Math.abs(p.y-e.y)<T)e.face=p.x<e.x?'l':'r';Sfx.charge();break;}e.fireCD=60;}
   if(e.ghostCD<=0&&e.y>T){const c=e.x/T,r=e.y/T,dx=p.x-e.x,dy=p.y-e.y,ax=dx?(dx>0?'r':'l'):null,ay=dy?(dy>0?'d':'u'):null;
    const tryD=(Math.abs(dx)>=Math.abs(dy)?[ax,ay]:[ay,ax]).filter(Boolean).find(d=>{const[ex,ey]=DIRS[d],c2=c+ex,r2=r+ey;return c2>=0&&c2<COLS&&r2>=2&&r2<ROWS&&!G.dug[r2][c2]&&!rockAt(c2,r2);});
    if(tryD){e.st='ghost';e.gT=0;e.gdir=tryD;e.left=false;e.inDirt=false;break;}e.ghostCD=30;}
   const c=e.x/T,r=e.y/T,opts=['u','d','l','r'].filter(d=>canGo(c,r,d));
   if(!opts.length){e.ghostCD=Math.min(e.ghostCD,40);break;}
   let cand=opts.filter(d=>d!==REV[e.dir]);if(!cand.length)cand=opts;
   if(rand()<0.55){const pc=p.x/T,pr=p.y/T;cand.sort((a,b)=>{const A=DIRS[a],B=DIRS[b];return Math.hypot(c+A[0]-pc,r+A[1]-pr)-Math.hypot(c+B[0]-pc,r+B[1]-pr);});e.dir=cand[0];}
   else if(!cand.includes(e.dir)||rand()<0.3)e.dir=cand[Math.floor(rand()*cand.length)];}
  stepToward(e,e.dir,spd);if(e.dir==='l'||e.dir==='r')e.face=e.dir;break;}
 case 'ghost':{e.gT++;if(e.flee){fleeMove(e,spd);break;}
  const gs=spd*0.7;
  if(!e.left){const[gx,gy]=DIRS[e.gdir];e.x+=gx*gs;e.y+=gy*gs;if(gx)e.face=gx<0?'l':'r';}
  else{const dx=p.x-e.x,dy=p.y-e.y,m=Math.hypot(dx,dy)||1;e.x+=dx/m*gs;e.y+=dy/m*gs;if(dx)e.face=dx<0?'l':'r';}
  e.x=Math.max(0,Math.min(FW-T,e.x));e.y=Math.max(T,Math.min(ROWS*T-T,e.y));
  const cc=Math.floor((e.x+T/2)/T),rr=Math.floor((e.y+T/2)/T);e.inDirt=!G.dug[rr][cc];
  if(e.inDirt)e.left=true;
  else if(e.left&&!rockAt(cc,rr)){e.st='emerge';e.inDirt=false;e.tc=cc;e.tr=rr;}
  else if(!e.left&&e.gT>60){e.st='emerge';e.tc=Math.round(e.x/T);e.tr=Math.round(e.y/T);}
  break;}
 case 'emerge':{const tx=e.tc*T,ty=e.tr*T,dx=tx-e.x,dy=ty-e.y,m=Math.hypot(dx,dy);
  if(m<=spd){e.x=tx;e.y=ty;e.st='walk';e.inDirt=false;e.ghostCD=Math.max(180,ghostCD());const opts=['u','d','l','r'].filter(d=>canGo(e.tc,e.tr,d));if(opts.length)e.dir=opts[Math.floor(rand()*opts.length)];}
  else{e.x+=dx/m*spd;e.y+=dy/m*spd;if(dx)e.face=dx<0?'l':'r';}break;}
 case 'charge':e.fT++;if(e.fT>=45){e.st='fire';e.fT=0;Sfx.fire();}break;
 case 'fire':e.fT++;e.flame=Math.min(3*T,e.fT*8);if(e.fT>=45){e.st='walk';e.flame=0;e.fireCD=ri(240,480)/(1+0.08*(G.round-1));}break;
 case 'inflate':if(!G.harp||G.harp.tgt!==e){e.defT++;if(e.defT>=50){e.defT=0;e.inf--;if(e.inf<=0){e.inf=0;if(aligned(e))e.st='walk';else{e.st='emerge';e.tc=Math.round(e.x/T);e.tr=Math.round(e.y/T);}}}}break;
 case 'pop':if(e.t>=24)e.gone=true;break;}}
